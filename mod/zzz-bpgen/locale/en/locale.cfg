[controls]
bpgen-window=bpgen: open the bpgen window
bpgen-request=bpgen: request blueprint for hovered assembler
bpgen-pick=bpgen: plan a line of the hovered item (inventory, chest, recipe icon)

[shortcut-name]
bpgen-window=bpgen

[entity-name]
bpgen-sandbox-power=bpgen sandbox power

[item-name]
bpgen-snapshot=bpgen snapshot
bpgen-patches=bpgen ore patches
bpgen-refit=bpgen refit
bpgen-move=bpgen move
bpgen-spot=bpgen pick spot

[item-description]
bpgen-spot=Click where the build should go: the bpgen window places it there, next to your bus, its belts and power connected.
bpgen-move=Drag over a section of your base: the bpgen window moves it to where you stand, its belts run to your base again.
bpgen-refit=Drag over a part of your base that grew all over the place: the bpgen window lays its machines out again as a compact mall in its place.
bpgen-patches=Drag over an ore patch to add it to the bpgen window's bus design.
bpgen-snapshot=Drag over the part of your base to build next to (the bpgen window's Extend tab): its belts feed the new part.

[mod-setting-name]
bpgen-web-window=bpgen: web window (pilot)

[mod-setting-description]
bpgen-web-window=With the fse loader in single player, the bpgen window is a web page over the game, the blueprint preview showing through it. Off: the game's own window. The gear of either window switches it too.
